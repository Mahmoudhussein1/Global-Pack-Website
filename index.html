<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Pack - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 60px 40px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            max-width: 500px;
            width: 100%;
            height: auto;
            margin-bottom: 40px;
        }

        h1 {
            color: #1a5f3f;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .description {
            color: #555;
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .contact {
            background: #f8f9fa;
            border-left: 4px solid #1a5f3f;
            padding: 20px;
            border-radius: 8px;
            margin-top: 40px;
        }

        .contact p {
            color: #333;
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .email {
            color: #1a5f3f;
            font-weight: 600;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .email:hover {
            color: #0f3d28;
            text-decoration: underline;
        }

        .loading-dots {
            display: inline-flex;
            gap: 8px;
            margin-top: 20px;
        }

        .dot {
            width: 12px;
            height: 12px;
            background-color: #1a5f3f;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2rem;
            }

            .description {
                font-size: 1rem;
            }

            .logo {
                max-width: 350px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .logo {
                max-width: 280px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="logo.jpeg" alt="Global Pack Logo" class="logo">

        <h1>New Website Coming Soon</h1>

        <p class="description">
            Our website is currently under development.
        </p>

        <div class="loading-dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="contact">
            <p>For any questions or business inquiries, reach us at:</p>
            <a href="mailto:info@globalpackeg.com" class="email">info@globalpackeg.com</a>
        </div>
    </div>
</body>
</html>
